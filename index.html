<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>

button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:.4rem .6rem;border-radius:.6rem}

.b{background:var(--pr);color:#fff;font-weight:600}.t{background:var(--sv)}.ic{font-size:1.2rem;line-height:1}.mb{display:none}

label{display:block;font-size:.8rem;color:var(--mu);margin:.8rem 0 .25rem}

.ci{min-width:0;flex:1}.ci b{font-size:1.05rem}

#cv{background-size:cover!important;background-position:center!important}
.m{display:flex;gap:.6rem;margin:1rem 0;align-items:flex-start}.m.u{justify-content:flex-end}
.mc{max-width:min(86%,36rem);min-width:0}.u .mc{display:flex;flex-direction:column;align-items:flex-end}

.ac{display:flex;gap:.1rem;margin-top:.2rem;opacity:.55;font-size:.85rem}.ac button{padding:.15rem .4rem}.ac .lk{color:var(--pr);opacity:1}

@keyframes d{0%,100%{opacity:.2}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.dots span{animation:none}#sb{transition:none!important}}

.row{display:flex;gap:.5rem;align-items:flex-end}.row textarea{resize:none;max-height:8rem;border-radius:1.6rem;background:var(--sv);border:0;padding:.85rem 1.1rem}
#send{border-radius:50%;width:2.8rem;height:2.8rem;flex:none;background:var(--tx);color:var(--bg)}

.er{color:var(--er);font-size:.85rem;margin:0 0 .4rem}

dialog::backdrop{background:#0008}
.hint{color:var(--mu);font-size:.8rem}
#toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:.5rem 1rem;border-radius:2rem;font-size:.85rem;display:none;z-index:30}
.pr{display:grid;grid-template-columns:19rem 1fr;gap:2rem;align-items:start}
.ph{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem}
.pn{font-size:1.6rem;color:var(--tx);margin:.6rem 0 0}
.big{width:100%;padding:.8rem;border-radius:2rem;margin:.6rem 0;font-size:1rem}
.st{display:flex;gap:1.2rem;width:100%;justify-content:center;color:var(--mu);font-size:.78rem}.st div{display:flex;flex-direction:column}.st b{color:var(--tx);font-size:1.05rem}
.pb section{background:var(--sf);border:1px solid var(--ln);border-radius:1.1rem;padding:1rem 1.1rem;margin-bottom:.8rem}
.pb h4{margin:0 0 .5rem;font-size:.95rem}
.chip{display:inline-block;background:var(--sv);border-radius:2rem;padding:.25rem .75rem;margin:0 .35rem .35rem 0;font-size:.85rem}
.lm{margin:.25rem 0;font-size:.92rem}.lm b{font-weight:600}
.ab{margin:0;color:var(--mu);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
#bk{display:none}
:root{color-scheme:light}:root[data-t=dark]{color-scheme:dark}
input[type=radio],input[type=checkbox]{width:auto;padding:0;flex:none}

dialog{max-height:90dvh;overflow-y:auto}

@media(max-width:760px){
 .mb{display:block}.pr{grid-template-columns:1fr}
 #sb{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;width:min(18rem,85vw)}
 body.sbo #sb{transform:none}body.sbo #bk{display:block;position:fixed;inset:0;background:#0007;z-index:10}
 .mc{max-width:90%}}
</style></head><body>
<div id="app"><aside id="sb"></aside><div id="pane"></div></div><div id="bk" data-a="sb"></div><div id="toast"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};

const PRE={midnight:['#0f2027','#2c5364'],dusk:['#2b1b4d','#7b4b94'],rose:['#ffc3a0','#ffafbd'],forest:['#134e5e','#71b280'],ocean:['#2193b0','#6dd5ed'],black:['#000','#000']};
let st={theme:'dark',scale:1,bg:'default',img:'',dim:.35,act:'d',temp:.85,max:400,ctx:3500,mem:true,
 prof:[{id:'d',name:'Home server',url:'http://192.168.1.100:8080/v1',key:'',model:'',pre:'local',type:'openai'}],...ld('st',{})};
let av=ld('av',[]),v={n:'home'},msgs=[],mem={f:[],s:'',su:0,fu:0},stream=null,err='',abort=null,mb=false,ei=null;
const cur=()=>av.find(a=>a.id===v.id),prof=()=>st.prof.find(p=>p.id===st.act)||st.prof[0],save=()=>sv('st',st);

const lastOf=id=>ld('c_'+id,[]).at(-1);
const rel=ts=>{const m=(Date.now()-ts)/6e4|0;return m<1?'just now':m<60?m+' min ago':m<1440?(m/60|0)+' h ago':(m/1440|0)+' d ago'};
const grp=ts=>{const d=Math.round((new Date().setHours(0,0,0,0)-new Date(ts).setHours(0,0,0,0))/864e5);return d<=0?'Today':d===1?'Yesterday':d<=7?'Previous 7 days':'Older'};
const snip=(t,n=60)=>{const x=t.replace(/\*[^*]*\*/g,' ').replace(/\s+/g,' ').trim()||t.replace(/\*/g,'');return x.length>n?x.slice(0,n-1)+'…':x};
const P=()=>mem.p||(mem.p={});
function sb(){const q=$('#sq')?.value||'';$('#sb').innerHTML=`<div class=brand>companion</div><button class=pill data-a=new>＋ Create</button><nav><button data-a=go data-v=home class="${v.n==='home'?'on':''}">Characters</button><button data-a=go data-v=set class="${v.n==='set'?'on':''}">Settings</button></nav><input id=sq placeholder="Search chats" value="${esc(q)}"><div id=sl></div>`;sl()}
function sl(){const e=$('#sl');if(!e)return;const q=($('#sq')?.value||'').toLowerCase();let g='',h='';
 for(const{a,l}of av.map(a=>({a,l:lastOf(a.id)})).filter(x=>x.l&&x.a.name.toLowerCase().includes(q)).sort((x,y)=>y.l.ts-x.l.ts)){const k=grp(l.ts);if(k!==g){h+=`<h3>${k}</h3>`;g=k}
  h+=`<button class="si ${v.id===a.id&&(v.n==='chat'||v.n==='prof')?'on':''}" data-a=open data-id=${a.id}>${pic(a,2.4)}<div><b>${esc(a.name)}</b><small>${esc(snip(l.t,40))}</small></div></button>`}
 e.innerHTML=h||'<p class=hint style="padding:.5rem">No chats yet.</p>'}
function learn(t){const p=P();let ch=0;
 for(const m of t.matchAll(/\bi (?:really |also |absolutely |just |totally )?(like|love|enjoy|adore|hate|dislike|can['’]t stand|cannot stand|am afraid of|fear)\s+([^.!?\n,;*]{2,40})/gi)){
  const x=m[2].trim().replace(/\s+(and|but|so|because|too)\b.*$/i,'');if(x.length<2||/^(you|u|it|that|this|how|when|what)\b/i.test(x))continue;
  const k=/hate|dislike|stand|afraid|fear/i.test(m[1])?'ud':'ul';p[k]=[x,...(p[k]||[]).filter(y=>y.toLowerCase()!==x.toLowerCase())].slice(0,12);ch=1}
 if(ch)sv('m_'+v.id,mem)}
async function profUp(a,p){const n=msgs.length;if(n-(mem.pu||0)<8)return;const U=a.user||'the user';
 const raw=strip(await chat(p,[{role:'system',content:'You analyse a roleplay chat and output ONLY a JSON object, nothing else.'},
  {role:'user',content:`Character: ${a.name}. Current profile: ${JSON.stringify(P())}\n\nRecent conversation:\n${msgs.slice(-16).map(x=>(x.r==='user'?U:a.name)+': '+x.t.slice(0,400)).join('\n')}\n\nReturn JSON with keys: "mood" (${a.name}'s mood right now, 1-4 words), "rel" (${a.name}'s relationship with ${U} right now, max 8 words), "likes" (things ${a.name} clearly likes, 1-4 words each), "dislikes" (things ${a.name} dislikes), "ul" (things ${U} likes), "ud" (things ${U} dislikes). Keep existing items that are still true, add new ones, max 8 per array. Use only what the chat or profile supports.`}],.2,400,false));
 let j;try{j=JSON.parse(raw.slice(raw.indexOf('{'),raw.lastIndexOf('}')+1))}catch{return}
 if(v.id!==a.id)return;const pr=P(),cl=x=>Array.isArray(x)?x.filter(y=>typeof y==='string'&&y.length<50).slice(0,8):null;
 for(const k of['likes','dislikes','ul','ud']){const c=cl(j[k]);if(c)pr[k]=c}
 for(const k of['mood','rel'])if(typeof j[k]==='string'&&j[k].length<80)pr[k]=j[k];
 mem.pu=n;sv('m_'+a.id,mem)}
let lore=[],recalled=[];
function loreTxt(){recalled=[];if(!lore.length)return'';const rc=msgs.slice(-4).map(m=>m.t).join(' ').toLowerCase(),last=(msgs.at(-1)?.t||'').toLowerCase(),
  sc=e=>(e.always?2:0)+((e.keys||[]).some(k=>k&&last.includes(k.toLowerCase()))?1:0);
 const hit=lore.filter(e=>!e.off&&(e.always||(e.keys||[]).some(k=>k&&rc.includes(k.toLowerCase())))).sort((a,b)=>sc(b)-sc(a));
 let o='';const n=[];for(const e of hit){const l=`- ${e.title}: ${e.text}\n`;if(o.length+l.length>1600)break;o+=l;n.push(e)}
 if(!o)return'';n.forEach(e=>{e.hits=(e.hits||0)+1;e.last=Date.now()});recalled=n.map(e=>e.title);sv('l_'+v.id,lore);
 return`\n\nLorebook (established facts about your world and shared history; they are true, so use them naturally and consistently when relevant):\n${o}`}
async function loreUp(a,p){const n=msgs.length;if(n-(mem.lu||0)<6)return;const U=a.user||'the user',ex=lore.map(e=>`- ${e.title} (${e.auto?'auto':'written by user'}): ${e.text}`).join('\n').slice(0,2500)||'(none)';
 const raw=strip(await chat(p,[{role:'system',content:'You maintain a lorebook for a roleplay. Output ONLY a JSON array, nothing else.'},
  {role:'user',content:`Existing lorebook:\n${ex}\n\nRecent conversation between ${U} and ${a.name}:\n${msgs.slice(-14).map(x=>(x.r==='user'?U:a.name)+': '+x.t.slice(0,500)).join('\n')}\n\nList NEW or CHANGED lore worth recalling later: named people, places, objects, organisations, events, promises, secrets, rules of the world, shared history. Each item: {"title": short name, "keys": [2-5 trigger words or names], "text": 1-3 standalone sentences}. To update an entry marked auto, reuse its exact title. Never touch entries written by the user. Max 4 items. Return [] if nothing is new.`}],.2,600,false));
 let j;try{j=JSON.parse(raw.slice(raw.indexOf('['),raw.lastIndexOf(']')+1))}catch{return}
 if(v.id!==a.id||!Array.isArray(j))return;
 for(const x of j.slice(0,4)){if(!x||typeof x.title!=='string'||typeof x.text!=='string'||x.title.length>60||x.text.length>500)continue;
  const t=x.title.trim(),k=(Array.isArray(x.keys)?x.keys:[]).filter(z=>typeof z==='string'&&z.length<40).slice(0,6),e=lore.find(y=>y.title.toLowerCase()===t.toLowerCase());
  if(e){if(e.auto){e.text=x.text.trim();e.keys=[...new Set([...(e.keys||[]),...k])].slice(0,8);e.ts=Date.now()}}
  else lore.push({id:uid(),title:t,text:x.text.trim(),keys:k.length?k:[t],auto:true,ts:Date.now(),hits:0})}
 const au=lore.filter(e=>e.auto);if(au.length>60){const dr=new Set(au.sort((x,y)=>(x.hits||0)-(y.hits||0)||x.ts-y.ts).slice(0,au.length-60).map(e=>e.id));lore=lore.filter(e=>!dr.has(e.id))}
 mem.lu=n;sv('m_'+a.id,mem);sv('l_'+a.id,lore)}
function loreDlg(e,n){const d=$('#dlg');d.innerHTML=`<h3 style="margin-top:0">${n?'New lore entry':'Edit entry'}</h3><label>Title</label><input id=l-t value="${esc(e.title)}" placeholder="e.g. Lin International Group"><label>Lore</label><textarea id=l-x rows=5 placeholder="What ${esc(cur().name)} should know or recall">${esc(e.text)}</textarea><label>Trigger words, separated by commas</label><input id=l-k value="${esc((e.keys||[]).join(', '))}" placeholder="Leave empty to use the title"><label style="display:flex;gap:.6rem;align-items:center;color:var(--tx);font-size:.95rem"><input type=checkbox id=l-a style="width:auto" ${e.always?'checked':''}> Always include</label><p class=hint>Saved entries count as written by you, so the AI will not change them.</p><div class=row style="justify-content:flex-end;margin-top:1rem"><button data-a=pcancel>Cancel</button><button class=b data-a=lsave data-id=${e.id} data-new=${n?1:0}>Save</button></div>`;d.showModal()}
const PV={local:{n:'Local server',t:'openai',u:'http://192.168.1.100:8080/v1',m:'',h:'llama.cpp, Ollama, LM Studio or KoboldCpp on your network. No key needed.'},
 gemini:{n:'Google Gemini',t:'gemini',u:'https://generativelanguage.googleapis.com/v1beta',m:'gemini-3.8-flash',h:'Get a free key at aistudio.google.com/apikey. Press Test connection to list your models.'},
 openai:{n:'OpenAI',t:'openai',u:'https://api.openai.com/v1',m:'gpt-4o-mini',h:'Key from platform.openai.com/api-keys.'},
 anthropic:{n:'Anthropic Claude',t:'anthropic',u:'https://api.anthropic.com/v1',m:'claude-haiku-5-5',h:'Key from console.anthropic.com.'},
 openrouter:{n:'OpenRouter',t:'openai',u:'https://openrouter.ai/api/v1',m:'meta-llama/llama-3.3-70b-instruct',h:'One key for hundreds of models. Key from openrouter.ai/keys.'},
 groq:{n:'Groq',t:'openai',u:'https://api.groq.com/openai/v1',m:'llama-3.3-70b-versatile',h:'Very fast, with a free tier. Key from console.groq.com.'},
 custom:{n:'Custom',t:'openai',u:'https://',m:'',h:'Any other OpenAI-compatible API.'}};
function theme(){const d=st.theme==='dark'||(st.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);
 document.documentElement.dataset.t=d?'dark':'light';document.documentElement.style.setProperty('--ts',st.scale)}
const bgCss=()=>PRE[st.bg]?`linear-gradient(${PRE[st.bg][0]},${PRE[st.bg][1]})`:st.bg==='image'&&st.img?`linear-gradient(rgba(0,0,0,${st.dim}),rgba(0,0,0,${st.dim})),url(${st.img})`:'var(--bg)';
const pic=(a,s)=>`<div class=pic style="--s:${s}rem">${a.img?`<img src="${a.img}" alt="">`:esc(a.emoji||'🙂')}</div>`;
const rp=t=>esc(t).replace(/\*([^*\n]+)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');
const rs=(f,m,q)=>new Promise(r=>{const i=new Image;i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(f)});

/* ---------- LLM (OpenAI-compatible) ---------- */
function api(p,path){let b=p.url.trim().replace(/\/+$/,'');if(!/^https?:/.test(b))b='http://'+b;return(b.endsWith('/v1')?b:b+'/v1')+path}
function norm(m){const sys=m.filter(x=>x.role==='system').map(x=>x.content).join('\n\n'),ms=[];
 for(const x of m.filter(x=>x.role!=='system')){const l=ms.at(-1);if(l&&l.role===x.role)l.content+='\n\n'+x.content;else ms.push({role:x.role,content:x.content})}
 if(!ms.length||ms[0].role!=='user')ms.unshift({role:'user',content:'(The conversation begins.)'});return{sys,ms}}
async function sse(r,pick,cb){const rd=r.body.getReader(),dc=new TextDecoder();let buf='',out='';

  <h2>Appearance</h2><label>Theme</label><select data-k=theme>${['system','light','dark'].map(x=>`<option ${st.theme===x?'selected':''}>${x}</option>`).join('')}</select>

  <label>Chat background</label><div class=sw><button data-a=bg data-v=default class="${st.bg==='default'?'on':''}" style="background:var(--sv)" title=Default></button>${Object.keys(PRE).map(k=>`<button data-a=bg data-v=${k} class="${st.bg===k?'on':''}" style="background:${`linear-gradient(${PRE[k][0]},${PRE[k][1]})`}" title=${k}></button>`).join('')}<button data-a=bgimg class="${st.bg==='image'?'on':''}" style="background:var(--pc)" title="Your photo">🖼</button></div><input type=file id=bgf accept="image/*" hidden>
  ${st.bg==='image'?`<label>Photo dimming</label><input type=range min=0 max=.8 step=.05 value=${st.dim} data-k=dim>`:''}
  <h2>AI connection</h2><p class=hint>Use a server on your network, or an online provider such as Google Gemini, OpenAI, Anthropic, OpenRouter or Groq. Online providers receive your chats.</p>
  ${st.prof.map(p=>`<div class=pf><input type=radio name=pa ${st.act===p.id?'checked':''} data-a=pact data-id=${p.id}><div><b>${esc(p.name)}</b><small>${esc(PV[p.pre]?.n||'Local server')}${p.model?', '+esc(p.model):''}</small></div><button data-a=pedit data-id=${p.id}>✎</button>${st.prof.length>1?`<button data-a=pdel data-id=${p.id}>🗑</button>`:''}</div>`).join('')}<button class=t data-a=padd>+ Add API</button>
  <h2>Replies</h2><label>Creativity (${st.temp})</label><input type=range min=.1 max=1.5 step=.05 value=${st.temp} data-k=temp data-c=1>
  <label>Max reply length (${st.max} tokens)</label><input type=range min=100 max=1200 step=50 value=${st.max} data-k=max data-c=1>
  <label>Recent chat sent each turn (~${st.ctx} tokens)</label><input type=range min=1000 max=12000 step=500 value=${st.ctx} data-k=ctx data-c=1><p class=hint>Keep this below your server's context size. Older details come back through memory.</p>
  <h2>Memory</h2><label style="display:flex;gap:.6rem;align-items:center;color:var(--tx);font-size:1rem"><input type=checkbox style="width:auto" ${st.mem?'checked':''} data-k=mem> Long-term memory (a few extra requests per exchange)</label></main>`}}
function profDlg(p,isNew){const d=$('#dlg'),k=p.pre||'local',loc=k==='local'?' (optional)':'';
 d.innerHTML=`<h3 style="margin-top:0">AI connection</h3><label>Provider</label><select id=p-pt>${Object.entries(PV).map(([x,o])=>`<option value=${x} ${x===k?'selected':''}>${o.n}</option>`).join('')}</select><p class=hint id=p-h>${esc(PV[k].h)}</p>
 <label>Name</label><input id=p-n value="${esc(p.name)}"><label>Server address</label><input id=p-u value="${esc(p.url)}"><label>API key${loc}</label><input id=p-k type=password value="${esc(p.key)}" autocomplete=off><label>Model name${loc}</label><input id=p-m value="${esc(p.model)}"><div id=chips class=chips></div>
 <p class=hint>The key is stored only in this browser. Online providers receive your chats and apply their own content rules.</p>
 <div class=row style="margin-top:.8rem"><button class=t data-a=ptest>Test connection</button><span id=ps class=hint style="flex:1"></span></div>
 <div class=row style="justify-content:flex-end;margin-top:1rem"><button data-a=pcancel>Cancel</button><button class=b data-a=psave data-id=${p.id} data-new=${isNew?1:0}>Save</button></div>`;d.showModal()}
const pform=id=>{const k=$('#p-pt')?.value||'local';return{id,name:$('#p-n').value||'API',url:$('#p-u').value.trim(),key:$('#p-k').value.trim(),model:$('#p-m').value.trim(),pre:k,type:PV[k].t}};

/* ---------- events ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset,i=+d.i;
 if(a==='go'){if(abort&&v.n==='chat')abort.abort();v={n:d.v,id:d.v==='home'?null:v.id};if(d.v==='home')ei=null;render()}
 else if(a==='open')open(d.id,d.n||'chat');
 else if(a==='ladd')loreDlg({id:uid(),title:'',text:'',keys:[]},1);
 else if(a==='tolore')loreDlg({id:uid(),title:'',text:msgs[i].t.replace(/\*/g,'').trim().slice(0,400),keys:[]},1);
 else if(a==='led')loreDlg(lore.find(e=>e.id===d.id),0);
 else if(a==='lsave'){const t=$('#l-t').value.trim(),x=$('#l-x').value.trim();if(!t||!x)return toast('Title and lore are required');
  const k=$('#l-k').value.split(',').map(z=>z.trim()).filter(Boolean),o={hits:0,...(lore.find(e=>e.id===d.id)||{}),id:d.id,title:t,text:x,keys:k.length?k:[t],always:$('#l-a').checked,auto:false,ts:Date.now()};
  lore=d.new==='1'?[...lore,o]:lore.map(e=>e.id===o.id?o:e);sv('l_'+v.id,lore);$('#dlg').close();if(v.n==='lore')render();else toast('Saved to lorebook')}
 else if(a==='ldel'){if(confirm('Delete this entry?')){lore=lore.filter(e=>e.id!==d.id);sv('l_'+v.id,lore);render()}}
 else if(a==='lon'){const e=lore.find(e=>e.id===d.id);e.off=!e.off;sv('l_'+v.id,lore);render()}
 else if(a==='sb')document.body.classList.toggle('sbo');
 else if(a==='lk'){msgs[i].l=!msgs[i].l;sv('c_'+v.id,msgs);drawMsgs()}
 else if(a==='new'){v={n:'edit',id:null};ei=null;render()}
 else if(a==='edit'){e.stopPropagation();v={n:'edit',id:d.id};ei=cur().img||null;render()}
 else if(a==='del'){e.stopPropagation();if(confirm('Delete this avatar, its chat and its memory?')){av=av.filter(x=>x.id!==d.id);sv('av',av);localStorage.removeItem('c_'+d.id);localStorage.removeItem('m_'+d.id);localStorage.removeItem('l_'+d.id);v={n:'home'};render()}}
 else if(a==='photo')$('#fi').click();else if(a==='nophoto'){ei=null;$('#pv').innerHTML=pic({emoji:$('#e-emo').value},5)}
 else if(a==='save'){const n=$('#e-name').value.trim(),p=$('#e-pers').value.trim();if(!n||!p)return toast('Name and personality are required');
  const o={id:v.id||uid(),name:n,tag:$('#e-tag').value.trim(),emoji:$('#e-emo').value.trim()||'🙂',img:ei,user:$('#e-user').value.trim(),pers:p,greet:$('#e-greet').value.trim()};
  av=av.some(x=>x.id===o.id)?av.map(x=>x.id===o.id?o:x):[...av,o];sv('av',av);v={n:'home'};render()}
 else if(a==='send'||t.id==='send'){stream!==null?abort&&abort.abort():send()}
 else if(a==='regen')regen();
 else if(a==='cp'){navigator.clipboard?.writeText(msgs[i].t);toast('Copied')}
 else if(a==='ed'){const x=prompt('Edit message',msgs[i].t);if(x?.trim()){msgs[i].t=x.trim();sv('c_'+v.id,msgs);drawMsgs()}}
 else if(a==='rm'){msgs.splice(i,1);mem.su=Math.min(mem.su,msgs.length);mem.fu=Math.min(mem.fu,msgs.length);sv('c_'+v.id,msgs);sv('m_'+v.id,mem);drawMsgs()}
 else if(a==='reset'){if(confirm('Erase this chat and everything they remember?')){localStorage.removeItem('c_'+v.id);localStorage.removeItem('m_'+v.id);sv('l_'+v.id,ld('l_'+v.id,[]).filter(e=>!e.auto));open(v.id)}}
 else if(a==='addfact'){const x=$('#nf').value.trim();if(x){mem.f.push({id:uid(),t:x,ts:Date.now(),p:true});sv('m_'+v.id,mem);render()}}
 else if(a==='delfact'){mem.f=mem.f.filter(f=>f.id!==d.id);sv('m_'+v.id,mem);render()}
 else if(a==='pin'){const f=mem.f.find(f=>f.id===d.id);f.p=!f.p;sv('m_'+v.id,mem);render()}
 else if(a==='clrmem'){if(confirm('Clear saved facts and summary? The chat stays.')){mem={f:[],s:'',su:msgs.length,fu:msgs.length};sv('m_'+v.id,mem);render()}}
 else if(a==='bg'){st.bg=d.v;save();render()}else if(a==='bgimg')$('#bgf').click();
 else if(a==='pact'){st.act=d.id;save()}
 else if(a==='pedit')profDlg(st.prof.find(p=>p.id===d.id),false);
 else if(a==='padd')profDlg({id:uid(),name:PV.gemini.n,url:PV.gemini.u,key:'',model:PV.gemini.m,pre:'gemini',type:'gemini'},true);
 else if(a==='pdel'){st.prof=st.prof.filter(p=>p.id!==d.id);if(st.act===d.id)st.act=st.prof[0].id;save();render()}
 else if(a==='pcancel')$('#dlg').close();
 else if(a==='psave'){const p=pform(d.id);st.prof=d.new==='1'?[...st.prof,p]:st.prof.map(x=>x.id===p.id?p:x);if(d.new==='1')st.act=p.id;save();$('#dlg').close();render()}
 else if(a==='ptest'){const q=$('#ps');q.textContent='Testing…';try{const ms=await listModels(pform('x'));q.textContent=`Connected ✓ (${ms.length} model${ms.length===1?'':'s'})`;
  $('#chips').innerHTML=ms.slice(0,40).map(m=>`<button class=t data-a=pm data-m="${esc(m)}">${esc(m)}</button>`).join('')}catch(x){q.textContent=x.message==='Failed to fetch'?"Can't reach the server (check address, internet, key, CORS).":x.message}}
 else if(a==='pm')$('#p-m').value=d.m});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;st[k]=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;save();if(k==='theme')theme();if(t.dataset.c)t.previousElementSibling.textContent=t.previousElementSibling.textContent.replace(/\(.*?\)/,`(${k==='scale'?Math.round(st.scale*100)+'%':k==='max'?st.max+' tokens':k==='ctx'?'~'+st.ctx+' tokens':st.temp})`);if(k==='scale')theme()});
document.addEventListener('change',async e=>{if(e.target.id==='bgf'&&e.target.files[0]){st.img=await rs(e.target.files[0],1000,.7);st.bg='image';save();render()}if(e.target.dataset.k==='dim')render()});
document.addEventListener('input',e=>{if(e.target.id==='sq')sl()});
document.addEventListener('change',e=>{if(e.target.id!=='p-pt')return;const o=PV[e.target.value];$('#p-n').value=o.n;$('#p-u').value=o.u;$('#p-m').value=o.m;$('#p-h').textContent=o.h});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
render();
</script></body></html>
