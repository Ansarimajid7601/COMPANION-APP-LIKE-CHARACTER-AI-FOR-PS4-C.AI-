 $('#cs-ed').value=cs.code;csSetRW(cs.rw);csDraw();csTabs();csLogs();if(cs.code&&cs.lang!=='python')csRun(true);else csTabs()}
function csTabs(){const T=cs.tab,f=$('#cs-fr');if(!f)return;document.querySelectorAll('.cs-tabs [data-cs=tab]').forEach(b=>b.classList.toggle('on',b.dataset.t===T));

function csLogs(){const c=$('#cs-co');if(!c)return;const n=cs.logs.filter(l=>l.t==='error').length;c.innerHTML=(n?'<div class=fixbar><span>'+n+' error'+(n>1?'s':'')+' found</span><button class="b" data-cs=fix>🛠 Fix with AI</button></div>':'')+(cs.logs.length?cs.logs.map(l=>`<div class="lg ${l.t}">${esc(l.m)}</div>`).join(''):'<div class=lg style="opacity:.55">Console output appears here.</div>');c.scrollTop=1e9;b=$('#cs-bd-co');if(b)b.textContent=n?' ('+n+')':''}
function csLog(t,m){cs.logs.push({t,m});if(cs.logs.length>400)cs.logs.shift();csLogs()}
const csHook=d=>{const H='<script>'+CS_HOOK+'<\/script>';if(/<head[^>]*>/i.test(d))return d.replace(/<head[^>]*>/i,m=>m+H);if(/<html[^>]*>/i.test(d))return d.replace(/<html[^>]*>/i,m=>m+H);const dt=d.match(/^\s*<!doctype[^>]*>/i);return dt?dt[0]+H+d.slice(dt[0].length):H+d};
const csDoc=()=>cs.lang==='html'?cs.code:'<!doctype html><meta charset=utf-8><body style="font-family:system-ui,sans-serif;margin:1rem"><script>'+cs.code.replace(/<\/script/gi,'<\\/script')+'<\/script>';
async function csPy(code){cs.tab='co';csTabs();csLog('info','Loading Python… (the first run downloads about 10 MB)');
 try{if(!window.loadPyodide)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';s.onload=res;s.onerror=()=>rej(Error('Could not load the Python runtime. Check your internet connection.'));document.head.append(s)});
  cs.py=cs.py||await loadPyodide();cs.py.setStdout({batched:s=>csLog('log',s)});cs.py.setStderr({batched:s=>csLog('error',s)});await cs.py.runPythonAsync(code);csLog('info','✓ Finished')}catch(e){csLog('error',String(e.message||e))}}
function csRun(quiet){const f=$('#cs-fr');if(!f)return;if(!quiet)cs.code=$('#cs-ed')?.value??cs.code;if(csHid()){cs.stale=true;csSave();return}cs.stale=false;cs.ran=true;cs.logs=[];csLogs();csSave();

 f.srcdoc=csHook(csDoc());csTabs()}
function csApply(pg,go,man){cs.code=pg.code;cs.lang=pg.lang;const e=$('#cs-ed');if(e)e.value=pg.code;const l=$('#cs-lang');if(l)l.value=pg.lang;
 cs.tab=pg.lang==='python'?'co':pg.lang==='js'&&!/document\.|canvas|innerHTML/.test(pg.code)?'co':'pv';if(go&&matchMedia('(max-width:760px)').matches){cs.panel='out';const r=$('.cs');if(r)r.dataset.p='out';document.querySelectorAll('.cs-mt button').forEach(b=>b.classList.toggle('on',b.dataset.p==='out'))}
 if(man&&!cs.pv)csPv(true,1);csRun(true);if(csHid()){const b=$('.cs-pt');b&&b.classList.add('dot')}csMeter()}
const csLite=t=>t.replace(/```[^\n`]*\n[\s\S]*?```/g,m=>m.length>1500?'```\n[earlier code omitted; the current version is in the editor]\n```':m);
async function csSend(txt){if(cs.busy)return;const inp=$('#cs-in');txt=(txt??inp?.value??'').trim();if(!txt)return;
 cs.err='';cs.m.push({r:'user',t:txt,ts:Date.now()});if(inp){inp.value='';inp.style.height='auto'}cs.busy=true;cs.stream='';{const m=$('#cs-ml');if(m)SK.set(m,{t:m.scrollTop,s:1})}csDraw();
 const ed=$('#cs-ed')?.value??cs.code;if(ed!==cs.code)cs.code=ed;
 const hist=csPrompt().hist;
 let out='';try{out=strip(await chat(mainP(),hist,.3,4096,true,t=>{cs.stream=strip(t);if(v.n==='code')csDraw(true)}))}catch(e){if(e.name!=='AbortError')cs.err=e.message;else out=cs.stream||''}
 out=out||cs.stream||'';cs.busy=false;cs.stream=null;if(out.trim())cs.m.push({r:'ai',t:out,ts:Date.now()});csSave();
 if(v.n==='code'){csDraw();if(cs.auto&&out){const pg=csPage(csBlocks(out));if(pg)csApply(pg,true)}}}
function csDoc2(){return'<!doctype html><title>Preview</title><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style><iframe sandbox="allow-scripts allow-modals allow-forms allow-popups allow-downloads" srcdoc="'+csHook(csDoc()).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"></iframe>'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-cs]');if(!t)return;const a=t.dataset.cs,d=t.dataset;
 if(a==='send'){if(cs.busy){abort&&abort.abort()}else csSend()}
 else if(a==='qp')csSend(d.q);
 else if(a==='pvt')csPv(!cs.pv);
 else if(a==='jump'){const m=$('#cs-ml');SK.set(m,{t:m.scrollTop,s:1});m.scrollTop=m.scrollHeight;jmp()}
 else if(a==='new'||a==='new2'){$('#dlg').open&&$('#dlg').close();csNewChat()}
 else if(a==='hist')csHistDlg()
 else if(a==='open'){if(cs.busy)return toast('Wait for the reply, or press ■ to stop it');const h=cs.hist.find(x=>x.id===d.id);if(!h)return;csSave();csLoad(h);$('#dlg').close();cs.panel='chat';render()}
 else if(a==='del'){e.stopPropagation();const h=cs.hist.find(x=>x.id===d.id);if(!h||!confirm('Delete this chat?'))return;cs.hist=cs.hist.filter(x=>x!==h);if(h.id===cs.id){cs.id=uid();cs.m=[];cs.code='';cs.logs=[];sv('cs_id',cs.id)}sv('c_codehist',cs.hist);csHistDlg();if(v.n==='code')render()}

 else if(a==='run'){const l=$('#cs-lang');if(l)cs.lang=l.value;if(cs.tab==='cd'||!cs.code)cs.tab=cs.lang==='python'||cs.lang==='js'&&!/document\.|canvas/.test($('#cs-ed').value)?'co':'pv';csRun();if(matchMedia('(max-width:760px)').matches){cs.panel='out';$('.cs').dataset.p='out';document.querySelectorAll('.cs-mt button').forEach(b=>b.classList.toggle('on',b.dataset.p==='out'))}}
 else if(a==='fix'){if(cs.busy)return toast('Wait for the reply, or press ■ to stop it');const er=cs.logs.filter(l=>l.t==='error').map(l=>l.m).slice(-4).join('\n\n').slice(0,2500);if(!er)return;cs.panel='chat';const r=$('.cs');if(r)r.dataset.p='chat';document.querySelectorAll('.cs-mt button').forEach(b=>b.classList.toggle('on',b.dataset.p==='chat'));csSend('My code gives this error:\n\n'+er+'\n\nFind the cause and send the full fixed code.')}
 else if(a==='auto'){cs.auto=!cs.auto;t.classList.toggle('on',cs.auto);t.textContent='Auto '+(cs.auto?'on':'off');csSave()}
 else if(a==='newtab'){cs.code=$('#cs-ed').value;if(!cs.code.trim())return toast('Nothing to open yet');if(cs.lang==='python')return toast('Python runs in the Console tab');const u=URL.createObjectURL(new Blob([csDoc2()],{type:'text/html'}));window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}

 else if(a==='copy'||a==='blk'){const m=cs.m[+d.i];if(!m)return;const bl=csBlocks(m.t),b=bl[+d.b];if(!b)return;
  if(a==='copy'){(navigator.clipboard?.writeText(b.code)||Promise.reject()).then(()=>toast('Copied'),()=>toast('Copy failed'))}
  else{const pg=(b.lang==='html'||b.lang==='css')?csPage(bl):{lang:b.lang,code:b.code};if(!pg)return;csApply(pg,true,true)}}});

/* ---- sticky autoscroll: follows new text only while you are at the bottom; scroll up to read and it lets go ---- */
const SK=new WeakMap(),skSt=el=>SK.get(el)?.s!==0,

/* ---------- Back button: closes the open screen instead of leaving the site ---------- */
let stk=[],skipPop=0,popping=0,rootAt=0;

try{history.replaceState({s:0},'')}catch{}hp(1);
function navSync(){if(popping)return;const k=v.n+'|'+(v.id||'');
 if(!stk.length){stk.push({k,v:{...v}});return}
 if(stk.at(-1).k===k){stk[stk.length-1].v={...v};return}
 const i=stk.findIndex(x=>x.k===k);
 if(i>=0){const n=stk.length-1-i;stk.length=i+1;stk[i].v={...v};if(n>0){skipPop=1;history.go(-n);setTimeout(()=>{skipPop=0},700)}}
 else{stk.push({k,v:{...v}});hp(stk.length)}}
addEventListener('popstate',e=>{if(skipPop){skipPop=0;return}if(!e.state||typeof e.state.s!=='number')return;const s=e.state.s;

  hp(stk.length);return}
 while(stk.length>s&&stk.length>1)stk.pop();
 const t=stk.at(-1).v;popping=1;
 try{if(t.id&&!av.some(a=>a.id===t.id)){v={n:'home'};stk.length=1;stk[0]={k:'home|',v:{n:'home'}};render()}

  else{v={...t};if(t.n==='home')ei=null;render()}}finally{popping=0}});
